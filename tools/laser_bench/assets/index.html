<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Láser VL53L0X — distancia</title>
  <style>
    :root { color-scheme: dark; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0b0d12; color: #e8ecf1; margin: 0;
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: .4rem;
    }
    h1 {
      font-weight: 500; font-size: .85rem; letter-spacing: .18em;
      text-transform: uppercase; color: #8b93a7; margin: 0 0 .4rem;
    }
    .readout { display: flex; align-items: baseline; gap: .4rem; }
    #mm {
      font-size: 6rem; font-weight: 700; line-height: 1;
      font-variant-numeric: tabular-nums; color: #4fd6a3;
      transition: color .15s;
    }
    #mm.stale { color: #e0564a; }
    #unit { font-size: 1.6rem; color: #8b93a7; }
    #state { margin-top: .6rem; font-size: .9rem; color: #8b93a7; }
    #bar {
      margin-top: 1.4rem; width: min(80vw, 420px); height: 8px;
      background: #1b1f2a; border-radius: 4px; overflow: hidden;
    }
    #fill { height: 100%; width: 0; background: #4fd6a3; transition: width .15s; }
  </style>
</head>
<body>
  <h1>Distancia frontal · VL53L0X</h1>
  <div class="readout">
    <span id="mm">--</span><span id="unit">mm</span>
  </div>
  <div id="bar"><div id="fill"></div></div>
  <div id="state">conectando…</div>

  <script>
    const mmEl = document.getElementById('mm');
    const stEl = document.getElementById('state');
    const fill = document.getElementById('fill');
    const RANGE_MM = 2000;                 // fondo de escala de la barra

    async function poll() {
      try {
        const r = await fetch('/api/distance', { cache: 'no-store' });
        const d = await r.json();
        if (d.ok) {
          mmEl.textContent = d.mm;
          mmEl.classList.remove('stale');
          fill.style.width = Math.max(0, Math.min(100, (d.mm / RANGE_MM) * 100)) + '%';
          stEl.textContent = 'lectura ok';
        } else {
          mmEl.textContent = '--';
          mmEl.classList.add('stale');
          fill.style.width = '0';
          stEl.textContent = 'sin lectura (-1 / timeout)';
        }
      } catch (e) {
        mmEl.classList.add('stale');
        stEl.textContent = 'sin conexión con el servidor';
      }
    }
    setInterval(poll, 200);
    poll();
  </script>
</body>
</html>
